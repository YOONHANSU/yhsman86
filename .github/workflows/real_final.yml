name: Build FBNeo MMP Real Final Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: 'aleksei74/FBNeo'
        ref: 'master'

    - name: Install Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git crossbuild-essential-armhf

    - name: Clean and Dummy CD Source Code
      run: |
        TARGET_FILE="src/intf/cd/cd_img.inc"
        
        if [ -f "$TARGET_FILE" ]; then
          echo "=== 에러 유발 소스 내용물 전면 삭제 및 상위 함수 완벽 더미화 시작 ==="
          
          # retro_cdemu.cpp가 호출하는 모든 하위 함수 규격을 완벽히 채워 문법 에러 원천 차단
          printf '#include <string.h>\n' > $TARGET_FILE
          printf 'static void* cdimgChd = NULL;\n' >> $TARGET_FILE
          printf 'INT32 cdimgInit() { return 1; }\n' >> $TARGET_FILE
          printf 'INT32 cdimgExit() { return 0; }\n' >> $TARGET_FILE
          printf 'INT32 CDImageReadSector(void* pImage, INT32 nLba, UINT8* pDest, INT32 nType) { return 1; }\n' >> $TARGET_FILE
          printf 'INT32 CDImageReadUserSector(void* pImage, INT32 nLba, UINT8* pDest, INT32* nType) { return 1; }\n' >> $TARGET_FILE
          printf 'INT32 CDImageGetChdSha1(const void* pImage, UINT8* pSha1) { return 1; }\n' >> $TARGET_FILE
          printf 'INT32 cdimgCountChdAudioTracks(void* pszPath) { return 0; }\n' >> $TARGET_FILE
          
          # 어제 마지막에 누락되어 터졌던 retro_cdemu.cpp 전용 상위 호출 함수들 추가 정의
          printf 'INT32 cdimgLoadSector(INT32 LBA, char* pBuffer) { return 1; }\n' >> $TARGET_FILE
          printf 'INT32 cdimgReadDataSector(INT32 nLba, UINT8* pBuffer) { return 1; }\n' >> $TARGET_FILE
          printf 'UINT8* cdimgReadTOC(INT32 track) { return NULL; }\n' >> $TARGET_FILE
          printf 'UINT8* cdimgReadQChannel() { return NULL; }\n' >> $TARGET_FILE
          printf 'INT32 cdimgGetSoundBuffer(INT16* buffer, INT32 samples) { return 0; }\n' >> $TARGET_FILE
          printf 'INT32 cdimgSetVolume(double dVolume) { return 0; }\n' >> $TARGET_FILE
          printf 'INT32 cdimgGetCurrentLBA() { return 0; }\n' >> $TARGET_FILE
          printf 'INT32 cdimgScan(INT32 nAction, INT32* pnMin) { return 0; }\n' >> $TARGET_FILE
          
          echo "=== 진 최종 무적의 껍데기 세척 완료 ==="
        else
          echo "파일을 찾을 수 없습니다."
        fi

    - name: Compile Custom FBNeo Core
      run: |
        cd src/burner/libretro
        
        # 모든 의존성 장벽이 완벽히 해결되었으므로 미유미니 규격으로 최종 빌드 완수
        make -f Makefile platform=classic_armv7-a \
          CC=arm-linux-gnueabihf-gcc \
          CXX=arm-linux-gnueabihf-g++ \
          AR=arm-linux-gnueabihf-ar \
          WANT_NEOGEO=1 \
          HAVE_NEON=1 \
          CFLAGS="-O3 -marm -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -Wno-write-strings -include wchar.h -D__LIBRETRO__ -D_GNU_SOURCE" \
          CXXFLAGS="-O3 -marm -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -Wno-write-strings -include cwchar -D__LIBRETRO__ -D_GNU_SOURCE"

    - name: Upload Finished Core (.so)
      uses: actions/upload-artifact@v4
      with:
        name: fbneo_libretro_miyoo
        path: src/burner/libretro/fbneo_libretro.so
