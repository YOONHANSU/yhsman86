name: Build FBNeo MMP Real Final Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: 'aleksei74/FBNeo'
        ref: 'master'

    - name: Find Makefile Location
      run: |
        echo "=== [1] 저장소 최상단 파일 목록 ==="
        ls -la
        
        echo "=== [2] 전체 폴더 안에서 libretro 메이크파일 검색 ==="
        find . -iname "*makefile.libretro*" -o -iname "*makefile*" || echo "찾지 못함"
