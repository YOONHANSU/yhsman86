name: Build FBNeo MMP Real Final Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: 'aleksei74/FBNeo'
        ref: 'master'

    - name: Install Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git crossbuild-essential-armhf

    - name: Patch CHD Source Code
      run: |
        # 세이부 축구와 무관하지만 빌드를 방해하는 cd_img.inc 내부의 CHD 에러 유발 함수들을 빈 껍데기로 강제 리팩토링
        TARGET_FILE="src/intf/cd/cd_img.inc"
        
        if [ -f "$TARGET_FILE" ]; then
          echo "=== CHD 에러 소스 코드 강제 패치 시작 ==="
          
          # ChdReadSector 호출부 에러 우회용 더미 리턴 처리
          sed -i 's/if (ChdReadSector(pImage->pChd, nLba, nType, pDest))/if (0)/g' $TARGET_FILE
          
          # CDImageGetChdSha1 함수 에러 우회
          sed -i 's/return pImage \&\& pImage->pChd ? ChdGetSha1(pImage->pChd, pSha1) : 1;/return 1;/g' $TARGET_FILE
          
          # cdimgExit 내부의 ChdClose 호출부 우회
          sed -i 's/ChdClose(cdimgChd);/\/\/ ChdClose(cdimgChd);/g' $TARGET_FILE
          
          # cdimgCountChdAudioTracks 함수 내부 우회
          sed -i 's/return ChdCountAudioTracks(pszPath);/return 0;/g' $TARGET_FILE
          
          # ChdImage 구조체 정의 부재 에러 방지를 위해 void* 형태로 강제 치환
          sed -i 's/static ChdImage\* cdimgChd/static void\* cdimgChd/g' $TARGET_FILE
          
          echo "=== 패치 완료 ==="
        else
          echo "패치할 파일을 찾을 수 없습니다. 경로를 확인하세요."
        fi

    - name: Compile Custom FBNeo Core
      run: |
        cd src/burner/libretro
        
        # 소스 코드가 세척되었으므로 안심하고 미유미니 규격으로 최종 링킹 단행
        make -f Makefile platform=classic_armv7-a \
          CC=arm-linux-gnueabihf-gcc \
          CXX=arm-linux-gnueabihf-g++ \
          AR=arm-linux-gnueabihf-ar \
          WANT_NEOGEO=1 \
          HAVE_NEON=1 \
          CFLAGS="-O3 -marm -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -Wno-write-strings -include wchar.h -D__LIBRETRO__ -D_GNU_SOURCE" \
          CXXFLAGS="-O3 -marm -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -Wno-write-strings -include cwchar -D__LIBRETRO__ -D_GNU_SOURCE"

    - name: Upload Finished Core (.so)
      uses: actions/upload-artifact@v4
      with:
        name: fbneo_libretro_miyoo
        path: src/burner/libretro/fbneo_libretro.so
