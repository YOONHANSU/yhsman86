name: Build FBNeo for Miyoo Mini Plus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: miyoocft/miyoo-toolchain:v3.1.0 # 미유미니 공식 SDK 빌드 환경 도커 이식
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: 'aleksei74/FBNeo'
        ref: 'master'

    - name: Compile Custom FBNeo Core
      run: |
        cd src/burn/libretro
        # 미유미니 공식 환경 내부의 크로스 컴파일러 경로 지정 및 최적화
        make -f Makefile.libretro platform=miyoo \
          CC=/opt/miyoo/usr/bin/arm-linux-gcc \
          CXX=/opt/miyoo/usr/bin/arm-linux-g++ \
          AR=/opt/miyoo/usr/bin/arm-linux-ar \
          WANT_NEOGEO=1 \
          HAVE_NEON=1 \
          CFLAGS="-O3 -marm -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
          CXXFLAGS="-O3 -marm -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard"

    - name: Upload Finished Core (.so)
      uses: actions/upload-artifact@v4
      with:
        name: fbneo_libretro_miyoo
        path: src/burn/libretro/fbneo_libretro.so
