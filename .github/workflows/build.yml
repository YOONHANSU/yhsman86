name: Build FBNeo for Miyoo Mini Plus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: 'aleksei74/FBNeo'
        ref: 'master'

    - name: Install Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git crossbuild-essential-armhf

    - name: Compile Custom FBNeo Core
      run: |
        cd src/burn/libretro
        # 미유미니에 맞춘 수동 크로스 컴파일 및 하드웨어 가속 강제 주입
        make -f Makefile.libretro platform=unix \
          CC=arm-linux-gnueabihf-gcc \
          CXX=arm-linux-gnueabihf-g++ \
          AR=arm-linux-gnueabihf-ar \
          SHARED="-shared -Wl,--version-script=link.options -Wl,--no-undefined" \
          WANT_NEOGEO=1 \
          HAVE_NEON=1 \
          CFLAGS="-O3 -march=armv7-a -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -fomit-frame-pointer" \
          CXXFLAGS="-O3 -march=armv7-a -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -fomit-frame-pointer"

    - name: Upload Finished Core (.so)
      uses: actions/upload-artifact@v4
      with:
        name: fbneo_libretro_miyoo
        path: src/burn/libretro/fbneo_libretro.so
