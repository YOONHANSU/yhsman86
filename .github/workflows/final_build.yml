name: Build FBNeo MMP Real Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Official Source Code
      uses: actions/checkout@v4
      with:
        repository: 'finalburnneo/FBNeo' # 공식 최신 FBNeo 소스코드를 통째로 다운로드
        ref: 'master'

    - name: Install Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git crossbuild-essential-armhf

    - name: Compile Custom FBNeo Core
      run: |
        # 실제 소스 파일이 존재하는 내부 폴더로 완벽하게 진입
        cd src/burn/libretro
        
        # 미유미니 플러스 사양(Cortex-A7, NEON 가속) 강제 주입 빌드
        make -f Makefile.libretro platform=miyoo \
          CC=arm-linux-gnueabihf-gcc \
          CXX=arm-linux-gnueabihf-g++ \
          AR=arm-linux-gnueabihf-ar \
          WANT_NEOGEO=1 \
          HAVE_NEON=1 \
          CFLAGS="-O3 -marm -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard" \
          CXXFLAGS="-O3 -marm -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard"

    - name: Upload Finished Core (.so)
      uses: actions/upload-artifact@v4
      with:
        name: fbneo_libretro_miyoo
        path: src/burn/libretro/fbneo_libretro.so
